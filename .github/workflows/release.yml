name: 手动构建并发布

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布版本标签 (例如: v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag_name }}
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v7

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: 还原依赖
        run: dotnet restore

      - name: Release 构建
        run: dotnet build -c Release

      - name: 校验产物
        shell: pwsh
        run: |
          $exe = "bin\Release\net48\LoLHelper.exe"
          if (-not (Test-Path $exe)) {
            throw "找不到 Release 产物：$exe"
          }
          Get-Item $exe | Select-Object Name, Length

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: bin/Release/net48/LoLHelper.exe
